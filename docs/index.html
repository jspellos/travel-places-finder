<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JS-Travel</title>
  <!--
    Home-screen launcher for the Streamlit app.

    Streamlit Community Cloud wraps every app in its own page, so a phone's
    "Add to Home screen" picks up Streamlit's name and icon. This page is
    served from GitHub Pages instead: it carries our own name, icon and
    manifest, and shows the app full-screen in a frame.

    `allow="geolocation"` is needed for the "Use my location" button to work
    inside the frame.
  -->
  <meta name="theme-color" content="#0F766E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="JS-Travel">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root { --bg: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e1117; } }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <iframe
    src="https://js-travel-places.streamlit.app/?embed=true"
    title="JS-Travel"
    allow="geolocation; clipboard-write; fullscreen"></iframe>
</body>
</html>
